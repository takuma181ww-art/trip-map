<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>トラベラー</title>
<!-- ホーム画面のアイコンと名前(元の絵は icon.svg。直したら 180×180 の PNG に書き出す) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-title" content="トラベラー">
<meta name="theme-color" content="#1d1d1f">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1d1d1f;
    --sub: #6b6b70;
    --line: #e3e1dc;
    --accent: #e8590c;      /* 印・線・強調 */
    --naver: #03c75a;       /* NAVER の緑 */
    --naver-text: #ffffff;
    --chip: #f0eee9;
    --shadow: 0 6px 20px rgba(0,0,0,.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --card: #1f1f22; --text: #f2f2f4; --sub: #a1a1a8; --line: #333338;
      --accent: #ff8a3d; --naver: #03c75a; --naver-text: #ffffff; --chip: #2a2a2e;
      --shadow: 0 6px 20px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --card: #1f1f22; --text: #f2f2f4; --sub: #a1a1a8; --line: #333338;
    --accent: #ff8a3d; --naver: #03c75a; --naver-text: #ffffff; --chip: #2a2a2e;
    --shadow: 0 6px 20px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: var(--bg); border-bottom: 1px solid var(--line); z-index: 2;
  }
  /* 左上は旅行の切りかえ(旅行の名前のプルダウン) */
  .trip-pick { position: relative; flex: 1; min-width: 0; }
  .trip-pick select {
    -webkit-appearance: none; appearance: none; width: 100%; max-width: 100%;
    border: 0; border-radius: 10px; background: var(--chip); color: var(--text);
    font-family: inherit; font-size: 16px; font-weight: 700; line-height: 1.2; padding: 8px 30px 8px 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trip-pick::after {
    content: '▾'; position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    color: var(--sub); font-size: 14px; pointer-events: none;
  }
  .add-btn {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0;
    background: var(--chip); color: var(--accent); font-family: inherit; font-size: 22px; font-weight: 700; line-height: 36px;
  }
  .now-btn {
    border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: #fff; font-family: inherit;
  }
  /* 日の切りかえ(day2.json などがある時だけ出る) */
  #days { flex: 1 0 100%; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #days:empty { display: none; }
  #days::-webkit-scrollbar { display: none; }
  #days a {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; text-decoration: none;
    background: var(--chip); color: var(--text); font-size: 13px; font-weight: 700;
  }
  #days a.on { background: var(--accent); color: #fff; }

  #map { flex: 1 1 50%; min-height: 0; background: var(--chip); }
  /* 暗い画面では地図の色を反転して目にやさしく(地図の画像そのものは1種類だけ使う) */
  :root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }
  }

  .pin {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--card); color: var(--accent); border: 2.5px solid var(--accent);
    display: grid; place-items: center; font: 700 13px/1 -apple-system, sans-serif;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s;
  }
  .pin.on { background: var(--accent); color: #fff; transform: scale(1.35); }
  .leaflet-marker-icon.on-top { z-index: 9999 !important; }
  /* 自分の位置(GPS)。青い点と、位置のずれの目安の円 */
  .me-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #1a73e8;
    border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,.35), 0 1px 4px rgba(0,0,0,.4);
  }
  .locate-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 18px; line-height: 40px; text-align: center; padding: 0;
  }
  /* 乗り降りする駅(その移動カードを選んだ時だけ出る) */
  .station {
    position: absolute; transform: translate(-50%, calc(-100% - 18px)); white-space: nowrap;
    background: var(--card); color: var(--text); border: 2px solid var(--text); border-radius: 8px;
    padding: 3px 7px; font: 700 12px/1.2 -apple-system, "Hiragino Sans", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  /* 札の下の小さな点が駅の位置 */
  .station::after {
    content: ''; position: absolute; left: 50%; bottom: -18px; width: 8px; height: 8px; margin-left: -4px;
    border-radius: 50%; background: var(--text); box-shadow: 0 0 0 2px var(--card);
  }
  .station small { color: var(--accent); margin-left: 4px; font-size: 11px; }

  #panel { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
  #dots { display: flex; justify-content: center; gap: 5px; padding: 8px 16px 0; flex-wrap: wrap; }
  #dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  #dots span.on { background: var(--accent); width: 16px; border-radius: 3px; }

  #cards {
    flex: 1; min-height: 0; display: flex; gap: 10px;
    overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px);
    scroll-padding: 0 16px; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  #cards::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 calc(100% - 28px); scroll-snap-align: start; scroll-snap-stop: always;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 14px 16px; display: flex; flex-direction: column; min-height: 0;
    border: 1.5px solid transparent;
  }
  .card.on { border-color: var(--accent); }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .num {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .num.plain { background: var(--chip); color: var(--sub); }
  .time { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .name { font-size: 16px; font-weight: 700; margin: 8px 0 6px; line-height: 1.35; }
  .memo { flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; line-height: 1.55; color: var(--text); }
  .memo ol { margin: 0; padding-left: 1.3em; }
  .memo li { margin: 2px 0; }
  .memo li::marker { color: var(--sub); font-size: 12px; }
  .memo p { margin: 0 0 4px; }
  .memo ol + *, .memo p + ol { margin-top: 4px; }
  .note { font-size: 12px; color: var(--sub); margin-top: 6px; }

  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns a {
    flex: 1; text-align: center; text-decoration: none; border-radius: 10px;
    padding: 11px 8px; font-size: 14px; font-weight: 700; line-height: 1.2;
  }
  .btn-naver { background: var(--naver); color: var(--naver-text); flex: 1.6 !important; }
  .btn-google { background: var(--chip); color: var(--text); }
  .btn-main { background: var(--accent); color: #fff; flex: 1.6 !important; }

  .card.move { background: var(--chip); box-shadow: none; justify-content: center; align-items: center; text-align: center; }
  .card.move .plane { font-size: 34px; }
  .card.move .name { margin: 6px 0 2px; }
  .card.move .time { font-size: 16px; color: var(--sub); }
  /* 行き方の手順はふつうの文と同じく左寄せで読む。短いメモは中央のまま */
  .card.move .move-memo { flex: 0 1 auto; margin-top: 8px; color: var(--sub); font-size: 13px; }
  .card.move .btns { align-self: stretch; gap: 6px; }
  .card.move .btns a { flex: 1 1 0 !important; min-width: 0; padding: 7px 4px; font-size: 12px; overflow-wrap: anywhere; }
  .card.move .btns a small { display: block; font-size: 10px; font-weight: 600; opacity: .85; }
  .card.move .move-memo:has(ol) { align-self: stretch; text-align: left; color: var(--text); font-size: 14px; }

  /* 予定どおりに動けなかった時、カードを「今」にして後ろの予定をずらす(旅行の当日だけ出る) */
  .shift-btn {
    margin-left: auto; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    border-radius: 999px; padding: 6px 10px; font-family: inherit; font-size: 12px; font-weight: 700; line-height: 1;
  }
  .card.move .shift-btn { margin: 8px 0 0; }
  .was { font-size: 12px; font-weight: 600; color: var(--sub); margin-left: 6px; }
  #shiftBar {
    flex: 1 0 100%; border: 0; border-radius: 10px; padding: 8px 12px; text-align: left;
    background: var(--chip); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.3;
  }
  #shiftBar b { color: var(--accent); }
  /* ここへ行く(徒歩・電車・タクシーの目安と、NAVER の経路を開くボタン) */
  .go { margin-top: 6px; }
  .go-label { font-size: 12px; color: var(--sub); margin-bottom: 3px; }
  .go-btns { display: flex; gap: 6px; }
  .go-btns a {
    flex: 1; text-align: center; text-decoration: none; border-radius: 999px; padding: 6px 4px;
    background: var(--chip); color: var(--text); font-size: 13px; font-weight: 700; line-height: 1.2;
    border: 1.5px solid transparent; white-space: nowrap;
  }
  .go-btns a small { font-size: 12px; font-weight: 600; color: var(--sub); }
  .go-btns a.best { border-color: var(--naver); }
  .go-btns a.best small { color: var(--naver); }
  /* 行けた・行けなかった(場所のある予定だけ)。GPSで近くに来たら自動で「行けた」 */
  .visit { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  .visit button {
    border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px;
    padding: 5px 10px; font-family: inherit; font-size: 12px; font-weight: 700; line-height: 1;
  }
  .visit button.on-done { background: #2f9e44; border-color: #2f9e44; color: #fff; }
  .visit button.on-skip { background: var(--sub); border-color: var(--sub); color: var(--bg); }
  .visit small { color: var(--sub); }
  .pin.done { border-color: #2f9e44; color: #2f9e44; }
  .pin.done.on { background: #2f9e44; color: #fff; }
  .pin.skip { opacity: .45; }
  #visitBar {
    flex: 1 0 100%; border: 0; border-radius: 10px; padding: 8px 12px; text-align: left;
    background: var(--chip); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1.3;
  }
  #visitBar b { color: #2f9e44; }
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,.45); display: flex; align-items: flex-end;
  }
  .sheet-wrap[hidden] { display: none; }
  .sheet-wrap .sheet {
    width: 100%; max-height: 85dvh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .sheet-wrap h2 { font-size: 17px; margin: 0 0 8px; }
  .sheet-wrap h3 { font-size: 14px; margin: 14px 0 4px; color: var(--sub); }
  .sheet-wrap ul { margin: 0; padding: 0; list-style: none; }
  .sheet-wrap li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; gap: 8px; }
  .sheet-wrap li span:first-child { flex: 0 0 auto; width: 1.4em; text-align: center; }
  .sheet-wrap .row { display: flex; gap: 8px; margin-top: 14px; }
  .sheet-wrap .row button, .empty-card button {
    flex: 1; border: 0; border-radius: 10px; padding: 11px; font-family: inherit; font-size: 14px; font-weight: 700;
    background: var(--chip); color: var(--text);
  }
  .sheet-wrap .row button.main, .empty-card button.main { background: var(--accent); color: #fff; }
  /* 新しい旅行の入力 */
  .sheet-wrap label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }
  .sheet-wrap input, .sheet-wrap textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text);
    font-family: inherit; font-size: 16px; padding: 9px 10px;
  }
  .sheet-wrap textarea { min-height: 84px; resize: vertical; }
  .sheet-wrap .dates { display: flex; gap: 8px; }
  .sheet-wrap .dates > div { flex: 1; min-width: 0; }
  .sheet-wrap .hint { font-size: 12px; color: var(--sub); margin: 8px 0 0; line-height: 1.5; }
  /* 予定がまだない旅行・日 */
  .empty-card { justify-content: center; gap: 8px; }
  .empty-card .name { margin: 0; }
  .empty-card p { white-space: pre-line; margin: 0; font-size: 14px; line-height: 1.55; color: var(--sub); }
  .empty-card .row { display: flex; gap: 8px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--accent); vertical-align: 2px; }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%);
    background: rgba(30,30,32,.92); color: #fff; padding: 8px 14px; border-radius: 10px;
    font-size: 13px; z-index: 1000; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; }
  #error { padding: 24px 16px; color: var(--sub); }
  /* 便利メニュー(右上の ⋯)と、交通費の見積もり */
  .tool-list button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--card); color: var(--text);
    font-family: inherit; font-size: 15px; font-weight: 700;
  }
  .tool-list button small { display: block; font-size: 12px; font-weight: 500; color: var(--sub); margin-top: 2px; }
  .tool-list .ic { font-size: 22px; }
  .fare-total { background: var(--card); border-radius: 14px; padding: 14px; margin: 6px 0 4px; text-align: center; box-shadow: var(--shadow); }
  .fare-total .lbl { font-size: 12px; font-weight: 700; color: var(--sub); }
  .fare-total .big { font-size: 28px; font-weight: 800; color: var(--accent); margin: 2px 0; }
  .fare-total .yen { font-size: 14px; font-weight: 700; color: var(--text); }
  .fare-total .sub { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
  .sheet-wrap li.fare { justify-content: space-between; align-items: baseline; }
  .sheet-wrap li.fare span:first-child { width: auto; text-align: left; flex: 1; min-width: 0; }
  .sheet-wrap li.fare .amt { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }
  .sheet-wrap li.fare.off { color: var(--sub); }
  .sheet-wrap li.fare small { color: var(--sub); }
  .fare-day { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; padding: 6px 0 0; }
  .fare-src { font-size: 11px; color: var(--sub); line-height: 1.5; margin-top: 10px; }
  .fare-src a { color: var(--sub); }
  /* 旅行と日常の切りかえ(タブ。上の帯を左右にスワイプしても切りかわる) */
  .mode-tabs { flex: 1 0 100%; display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .mode-tabs a {
    flex: 1; text-align: center; text-decoration: none; padding: 6px 0; border-radius: 8px;
    color: var(--sub); font-size: 14px; font-weight: 700;
  }
  .mode-tabs a.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  /* 日常の画面: 左上は今日の日付 */
  .day-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-title small { font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 6px; }
  /* 行きたい場所の入力(カードの上にいつも出す) */
  #dailyAdd { display: flex; gap: 8px; padding: 8px 16px 0; }
  #dailyAdd[hidden] { display: none; }
  #dailyAdd input {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text);
    font-family: inherit; font-size: 16px; padding: 9px 10px;
  }
  #dailyAdd button {
    flex: 0 0 auto; border: 0; border-radius: 10px; padding: 0 14px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 700;
  }
  .found li { cursor: pointer; flex-direction: column; gap: 2px; }
  .found li b { font-size: 15px; }
  .found li small { color: var(--sub); font-size: 12px; line-height: 1.4; }
  .found li.plain b { color: var(--accent); }
</style>
</head>
<body>
<header>
  <nav class="mode-tabs" id="modeTabs" aria-label="旅行と日常の切りかえ">
    <a href="?mode=trip" data-mode="trip">✈︎ 旅行</a><a href="?mode=daily" data-mode="daily">🏠 日常</a>
  </nav>
  <div class="day-title" id="dayTitle" hidden></div>
  <div class="trip-pick"><select id="tripSel" aria-label="旅行の切りかえ"><option>読みこみ中…</option></select></div>
  <button class="add-btn" id="addTrip" type="button" aria-label="新しい旅行を足す" title="新しい旅行を足す">＋</button>
  <button class="now-btn" id="nowBtn" type="button">今ここ</button>
  <button class="add-btn" id="toolBtn" type="button" aria-label="便利メニュー" title="便利メニュー">⋯</button>
  <nav id="days" aria-label="日の切りかえ"></nav>
  <button id="shiftBar" type="button" hidden></button>
  <button id="visitBar" type="button" hidden></button>
</header>
<div id="map" role="region" aria-label="地図"></div>
<div id="panel">
  <form id="dailyAdd" hidden autocomplete="off">
    <input id="dQuery" type="search" enterkeyhint="search" placeholder="行きたい場所を入れる(例: 駅前のパン屋)" maxlength="80" aria-label="行きたい場所">
    <button type="submit">探す</button>
  </form>
  <div id="dots" aria-hidden="true"></div>
  <div id="cards" role="list"></div>
</div>
<div id="toast" role="status"></div>
<div id="visitSheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-label="行けた場所・行けなかった場所"></div></div>
<div id="addSheet" class="sheet-wrap" hidden>
  <form class="sheet" role="dialog" aria-label="新しい旅行を足す" autocomplete="off">
    <h2>新しい旅行を足す</h2>
    <label for="fDest">行き先</label>
    <input id="fDest" placeholder="例: 韓国(ソウル)" maxlength="40">
    <div class="dates">
      <div><label for="fStart">1日目</label><input id="fStart" type="date" required></div>
      <div><label for="fEnd">最後の日</label><input id="fEnd" type="date" required></div>
    </div>
    <label for="fName">旅行の名前</label>
    <input id="fName" placeholder="例: 2027年5月 韓国旅行" maxlength="40" required>
    <label for="fMemo">行きたい所・やりたいこと(あれば)</label>
    <textarea id="fMemo" maxlength="2000" placeholder="例: 1日目は聖水のカフェ、2日目は明洞で買い物"></textarea>
    <p class="hint">この iPhone の中に下書きとしてできます(すぐ見られます)。公開のページに入れるのは、下書きの「Claude に頼む文をコピー」を Claude Code に貼って頼みます。自宅の住所・予約番号・フルネームは書かないでください(ページは誰でも見られます)。</p>
    <div class="row"><button type="submit" class="main">下書きをつくる</button><button type="button" data-act="close">やめる</button></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<div id="toolSheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-label="便利メニュー">
    <h2>便利メニュー</h2>
    <div class="tool-list">
      <button type="button" data-tool="fare"><span class="ic">🚇</span><span>交通費の見積もり<small>予定を電車・バスで回ると、いくらくらい?(IC カードのチャージのめやす)</small></span></button>
    </div>
    <div class="row"><button type="button" data-act="close">閉じる</button></div>
  </div>
</div>
<div id="fareSheet" class="sheet-wrap" hidden><div class="sheet" role="dialog" aria-label="交通費の見積もり"></div></div>
<div id="findSheet" class="sheet-wrap" hidden>
  <div class="sheet" role="dialog" aria-label="行きたい場所を足す">
    <h2 id="findTitle">行きたい場所を足す</h2>
    <label for="dTime">時間(なくてもよい)</label>
    <input id="dTime" type="time">
    <label for="dMemo">メモ(なくてもよい)</label>
    <input id="dMemo" maxlength="200" placeholder="例: 11時開店・テイクアウト">
    <h3>どこですか?(押すと足します)</h3>
    <ul class="found" id="foundList"></ul>
    <p class="hint">この iPhone の中だけに保存します(公開のページには出ません)。</p>
    <div class="row"><button type="button" data-act="close">やめる</button></div>
  </div>
</div>
<script>
// 旅行の一覧 data/trips.json と、旅行ごとの data/trips/<id>/day1.json, day2.json … を読む。
// ?trip=<id>&day=day2 で開くとその旅行のその日。前のリンク(?day=day2 だけ)は、ふつうに開いた時と同じ旅行を出す。
const Q = new URLSearchParams(location.search);
const TRIP_PARAM = Q.get('trip');
const DAY_PARAM = Q.get('day');
let DAY = DAY_PARAM || 'day1';
let trip = null, trips = [];
// 上の日付ボタンで選んだ日(アプリを開いている間だけ覚える)と、最後に見た日
const store = (kind, key, val) => { try { const s = window[kind]; if (val === undefined) return s.getItem(key); s.setItem(key, val); } catch (e) { return null; } };
const CIRCLED = ['', '①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];

let data, items = [], markers = {}, stationLayers = {}, active = -1, map;
let offsets = [];
let me = null, meMarker = null, meCircle = null, watching = false;  // 自分の位置(GPS)
let allDays = [];
let DAILY = false;   // 日常の画面か(旅行の画面と同じ地図とカードで、その日の行きたい場所を出す)

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = t => t.replace(/^0/, '');

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2600);
}

// NAVER はアプリを直接開くのがいちばん確実(座標で場所を指せる)。
// アプリが入っていない時は 1.5 秒後にサイトの検索へ切り替える。
// ---- ここへ行く ----
// 目安の時間は、出発地(GPS の現在地、なければ1つ前の予定)からの直線距離で出す。
// 押すと NAVER の経路を、その移動手段で開く(出発地は NAVER 側で現在地になる)。
const GO_MODES = [
  { key: 'walk', icon: '🚶', name: '徒歩', mins: d => Math.round(d * 1.3 / 75) },
  { key: 'public', icon: '🚇', name: '電車・バス', mins: d => Math.round(8 + d * 1.3 / 450) },
  { key: 'car', icon: '🚕', name: 'タクシー', mins: d => Math.round(3 + d * 1.4 / 350) }
];
function goOrigin(i) {
  if (me) return { pt: me, label: '現在地から' };
  const prev = neighbor(i, -1);
  return prev ? { pt: [prev.lat, prev.lng], label: `「${prev.name}」から` } : null;
}
// 1.2km までは徒歩、15km までは電車・バス(ソウルは地下鉄が速くて安い)、それより遠ければタクシー
function bestMode(d) { return d <= 1200 ? 'walk' : d <= 15000 ? 'public' : 'car'; }
function goHtml(it, i) {
  if (!isPlace(it) || it.country !== 'kr') return '';
  return `<div class="go" data-go="${i}">
    <div class="go-label">ここへ行く</div>
    <div class="go-btns">${GO_MODES.map(m =>
      `<a href="#" data-route="${i}:${m.key}" aria-label="${m.name}の経路をNAVERで開く">${m.icon} <small data-mins="${m.key}">${m.name}</small></a>`).join('')}</div>
  </div>`;
}
// カードの目安の時間を、今の出発地で書き直す(GPS が動くたびにも呼ぶ)
function updateGoTimes() {
  document.querySelectorAll('[data-go]').forEach(box => {
    const i = +box.dataset.go, it = items[i], o = goOrigin(i);
    if (!o) return;
    const d = map.distance(o.pt, [it.lat, it.lng]), best = bestMode(d);
    const dist = d < 50 ? 'すぐ近く' : '約' + (d < 1000 ? Math.round(d / 10) * 10 + 'm' : (d / 1000).toFixed(1) + 'km');
    const name = GO_MODES.find(m => m.key === best).name;
    box.querySelector('.go-label').textContent = `ここへ行く:${o.label} ${dist}・おすすめは${name}(時間は目安)`;
    GO_MODES.forEach(m => {
      const a = box.querySelector(`[data-route="${i}:${m.key}"]`);
      a.classList.toggle('best', m.key === best);
      a.querySelector('small').textContent = `${Math.max(1, m.mins(d))}分`;
    });
  });
}
function routeUrl(i, mode) {
  const it = items[i];
  return `nmap://route/${mode}?dlat=${it.lat}&dlng=${it.lng}&dname=${encodeURIComponent(it.kr || it.name)}` +
         '&appname=' + encodeURIComponent(location.hostname || 'trip-map');
}
function openRoute(i, mode, e) {
  e.preventDefault();
  const it = items[i];
  const app = routeUrl(i, mode);
  const web = 'https://map.naver.com/p/search/' + encodeURIComponent(it.kr || it.name);
  const t = setTimeout(() => { if (!document.hidden) location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once: true });
  location.href = app;
}

function openNaver(it, e) {
  e.preventDefault();
  const app = 'nmap://place?lat=' + it.lat + '&lng=' + it.lng +
              '&name=' + encodeURIComponent(it.name) + '&appname=' + encodeURIComponent(location.hostname || 'trip-map');
  const web = 'https://map.naver.com/p/search/' + encodeURIComponent(it.kr || it.name);
  const t = setTimeout(() => { if (!document.hidden) location.href = web; }, 1500);
  document.addEventListener('visibilitychange', () => clearTimeout(t), { once: true });
  location.href = app;
}
// 座標があやしい所(住所からのおおよその位置)は、googleQuery に住所を書いておくと住所で探す
function googleUrl(it) {
  return 'https://www.google.com/maps/search/?api=1&query=' + (it.googleQuery ? encodeURIComponent(it.googleQuery) : it.lat + ',' + it.lng);
}

function memoHtml(memo) {
  // 文(。)ごとに分け、「→」でつながった文は番号つきの手順にして読みやすく
  return String(memo || '').split('。').map(s => s.trim()).filter(Boolean).map(sentence => {
    const steps = sentence.split('→').map(s => s.trim()).filter(Boolean);
    if (steps.length <= 1) return '<p>' + esc(sentence) + '</p>';
    return '<ol>' + steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>';
  }).join('');
}

function cardHtml(it, i) {
  if (it.type === 'move') {
    return `<article class="card move" role="listitem" data-i="${i}">
      <div class="plane" aria-hidden="true">${esc(it.icon || '✈︎')}</div>
      <div class="name">${esc(it.name)}</div>
      <div class="time">${hm(it.time)} → ${hm(it.end)}${wasHtml(i)}</div>
      ${shiftBtn(i, 'ここから再開')}
      ${it.memo ? `<div class="memo move-memo">${memoHtml(it.memo)}</div>` : ''}
      ${it.stations ? `<div class="btns">${it.stations.map((st, j) =>
        `<a class="btn-naver" href="#" data-station="${i},${j}">${esc(st.name)}${st.role ? `<small>${esc(st.role)}</small>` : ''}</a>`).join('')}</div>` : ''}
    </article>`;
  }
  const hasPlace = it.lat != null;
  let btns = '';
  if (hasPlace && it.country === 'kr') {
    btns = `<a class="btn-naver" href="#" data-naver="${i}">NAVERマップで開く</a>
            <a class="btn-google" href="${googleUrl(it)}" target="_blank" rel="noopener">Googleマップ</a>`;
  } else if (hasPlace) {
    // 日本の中は Google マップのナビが使えるので、こちらを目立たせる
    btns = `<a class="btn-main" href="${googleUrl(it)}" target="_blank" rel="noopener">Googleマップで開く</a>`;
  }
  return `<article class="card" role="listitem" data-i="${i}">
    <div class="card-head">
      <div class="num ${hasPlace ? '' : 'plain'}">${it.no ?? ''}</div>
      <div class="time">${it.time ? hm(it.time) : DAILY || it.local ? '<span class="was">時間なし</span>' : ''}${wasHtml(i)}</div>
      ${DAILY || it.local ? `<button class="shift-btn" type="button" data-del="${i}">消す</button>` : shiftBtn(i, 'ここから再開')}
    </div>
    <div class="name">${esc(it.name)}${it.local && !DAILY ? ' <span class="badge">この iPhone だけ</span>' : ''}</div>
    <div class="memo">${memoHtml(it.memo)}</div>
    ${hasPlace ? '' : '<div class="note">地図の印はありません</div>'}
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
    ${goHtml(it, i)}
    ${visitHtml(it, i)}
    ${btns ? `<div class="btns">${btns}</div>` : ''}
  </article>`;
}

// ---- 行けた・行けなかった ----
// 記録はその端末だけ(localStorage)。日付と予定の名前で覚えるので、カードの順番が変わってもずれない。
const VISIT_KEY = 'trip-visits';
const VISIT_NEAR_M = 150;
function loadVisits() { try { return JSON.parse(localStorage.getItem(VISIT_KEY) || '{}') || {}; } catch (e) { return {}; } }
function saveVisits(v) { try { localStorage.setItem(VISIT_KEY, JSON.stringify(v)); } catch (e) {} }
const visitId = (date, it) => date + '|' + it.name;
const isPlace = it => it.type !== 'move' && it.lat != null;
function visitOf(it, date = data.date) { return loadVisits()[visitId(date, it)]; }
function visitHtml(it, i) {
  if (!isPlace(it)) return '';
  const v = visitOf(it);
  const note = v ? `<small>${v.s === 'done' ? `${esc(v.t || '')}${v.auto ? '(自動)' : ''}` : ''}</small>` : '';
  return `<div class="visit">
    <button type="button" data-visit="${i}:done" class="${v?.s === 'done' ? 'on-done' : ''}">✓ 行けた</button>
    <button type="button" data-visit="${i}:skip" class="${v?.s === 'skip' ? 'on-skip' : ''}">行けなかった</button>
    ${note}
  </div>`;
}
function setVisit(i, s, auto = false) {
  const it = items[i], v = loadVisits(), id = visitId(data.date, it);
  if (!auto && v[id]?.s === s) delete v[id];  // 同じボタンをもう一度押すと消す
  else v[id] = { s, t: toHM(nowMin()), auto };
  saveVisits(v); refreshVisits();
}
function refreshVisits() {
  const keep = active;
  renderCards(); active = -1; setActive(keep, { fly: false });
  items.forEach((it, i) => {
    const el = markers[i]?.getElement()?.querySelector('.pin');
    if (!el) return;
    const v = visitOf(it);
    el.classList.toggle('done', v?.s === 'done'); el.classList.toggle('skip', v?.s === 'skip');
  });
  const all = allDays.flatMap(d => d.data.items.filter(isPlace).map(it => visitOf(it, d.data.date)));
  const done = all.filter(v => v?.s === 'done').length, skip = all.filter(v => v?.s === 'skip').length;
  const bar = $('#visitBar');
  bar.hidden = !(done || skip);
  bar.innerHTML = `📍 行けた <b>${done}</b> ・ 行けなかった ${skip} ・ まだ ${all.length - done - skip} <small>(タップで一覧)</small>`;
}
// GPS が予定の場所から 150m 以内に入ったら、旅行の当日だけ自動で「行けた」にする
function autoVisit(pos) {
  if (!isTripDay() || (pos.coords.accuracy || 0) > 200) return;
  // 近くに予定が2つある時は、いちばん近い1つだけ(それがもう記録済みなら何もしない)
  let best = -1, bestD = VISIT_NEAR_M;
  items.forEach((it, i) => {
    if (!isPlace(it)) return;
    const d = map.distance(me, [it.lat, it.lng]);
    if (d <= bestD) { best = i; bestD = d; }
  });
  if (best < 0 || visitOf(items[best])) return;
  setVisit(best, 'done', true);
  toast(`「${items[best].name}」に着いたので、行けたに記録しました`);
}
function visitListText() {
  return allDays.map(d => {
    const rows = d.data.items.filter(isPlace).map(it => {
      const v = visitOf(it, d.data.date);
      return (v?.s === 'done' ? '✓ ' : v?.s === 'skip' ? '✗ ' : '・ ') + it.name + (v?.s === 'done' && v.t ? `(${v.t})` : '');
    });
    return `${d.data.title}(${d.data.date})\n${rows.join('\n')}`;
  }).join('\n\n');
}
function openVisitSheet() {
  const box = $('#visitSheet .sheet');
  box.innerHTML = '<h2>行けた場所・行けなかった場所</h2>' + allDays.map(d => {
    const rows = d.data.items.filter(isPlace).map(it => {
      const v = visitOf(it, d.data.date);
      const mark = v?.s === 'done' ? '✓' : v?.s === 'skip' ? '✗' : '・';
      return `<li><span>${mark}</span><span>${esc(it.name)}${v?.s === 'done' && v.t ? ` <small>${esc(v.t)}</small>` : ''}</span></li>`;
    }).join('');
    return `<h3>${esc(d.data.title)}</h3><ul>${rows}</ul>`;
  }).join('') + `<div class="row"><button type="button" class="main" data-act="copy">一覧をコピー</button><button type="button" data-act="close">閉じる</button></div>`;
  $('#visitSheet').hidden = false;
}

// ---- 予定のずらし ----
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toHM = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const nowMin = () => { const l = new Date(Date.now() + 9 * 3600000); return l.getUTCHours() * 60 + l.getUTCMinutes(); };
const isTripDay = () => data && data.date === todayStr();
const shiftKey = () => 'trip-shift:' + data.date;

function shiftBtn(i, label) {
  return isTripDay() && !DAILY ?`<button class="shift-btn" type="button" data-shift="${i}">${label}</button>` : '';
}
function wasHtml(i) {
  return offsets[i] ? `<span class="was">予定 ${hm(items[i].t0)}</span>` : '';
}
function applyOffsets() {
  items.forEach((it, i) => {
    if (!it.t0) return;   // 入力枠で足した「時間なし」の予定はずらさない
    const d = offsets[i] || 0;
    it.time = toHM(toMin(it.t0) + d);
    if (it.e0) it.end = toHM(toMin(it.e0) + d);
  });
  const last = offsets.findLast ? offsets.findLast(Boolean) : [...offsets].reverse().find(Boolean);
  const bar = $('#shiftBar');
  if (last) {
    bar.innerHTML = `⏱ 予定を<b>${last > 0 ? '+' : ''}${last}分</b>ずらしています ・ タップで元に戻す`;
    bar.hidden = false;
  } else bar.hidden = true;
}
function saveOffsets() {
  try { localStorage.setItem(shiftKey(), JSON.stringify(offsets)); } catch (e) {}
}
function loadOffsets() {
  try { const v = JSON.parse(localStorage.getItem(shiftKey()) || '[]'); if (Array.isArray(v)) offsets = v; } catch (e) {}
}
// i 番目のカードを今の時刻にして、それより後ろも同じだけずらす(5分単位)
function shiftFrom(i) {
  const d = Math.round((nowMin() - toMin(items[i].t0)) / 5) * 5;
  for (let j = i; j < items.length; j++) offsets[j] = d;
  saveOffsets(); applyOffsets(); renderCards();
  active = -1; setActive(i, { scroll: true, fly: false });
  toast(d === 0 ? '予定どおりです' : `ここから後ろを ${d > 0 ? '+' : ''}${d}分 ずらしました`);
}

// ---- 自分の位置(GPS) ----
function startWatch() {
  if (watching || !('geolocation' in navigator)) return;
  watching = true;
  navigator.geolocation.watchPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude];
    const acc = Math.min(pos.coords.accuracy || 0, 500);
    if (!meMarker) {
      meCircle = L.circle(me, { radius: acc, color: '#1a73e8', weight: 1, opacity: .4, fillOpacity: .12, interactive: false }).addTo(map);
      meMarker = L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
        zIndexOffset: 2000, keyboard: false, title: '現在地' }).addTo(map);
      // 日常で場所がまだない日は、自分のまわりを出す
      if (DAILY && !places().length) map.setView(me, 15);
    } else { meMarker.setLatLng(me); meCircle.setLatLng(me).setRadius(acc); }
    autoVisit(pos);
    if (!updateGoTimes.t) updateGoTimes.t = setTimeout(() => { updateGoTimes.t = 0; updateGoTimes(); }, 3000);
  }, err => {
    watching = false;
    if (err.code === 1) toast('位置情報が許可されていません(設定 → プライバシー → 位置情報 で Safari を許可)');
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
function addLocateButton() {
  const Ctl = L.Control.extend({ options: { position: 'topright' }, onAdd() {
    const b = L.DomUtil.create('button', 'locate-btn');
    b.type = 'button'; b.title = '現在地へ'; b.setAttribute('aria-label', '現在地へ'); b.textContent = '📍';
    L.DomEvent.disableClickPropagation(b);
    b.addEventListener('click', () => {
      startWatch();
      if (me) map.flyTo(me, Math.max(map.getZoom(), 16), { duration: .8 });
      else toast('現在地を探しています…');
    });
    return b;
  } });
  new Ctl().addTo(map);
}

function renderCards() {
  if (!items.length && DAILY) {
    $('#cards').innerHTML = `<article class="card empty-card on" role="listitem">
      <div class="name">${esc(dailyLabel(data.date))}の行きたい場所</div>
      <p>まだありません。上の欄に行きたい場所を入れて「探す」を押すと、地図とカードに出ます。\n時間やメモも付けられます。</p>
    </article>`;
    return;
  }
  if (!items.length) {
    $('#cards').innerHTML = emptyCardHtml(allDays);
    $('#cards [data-act="del"]')?.addEventListener('click', deleteDraft);
    $('#cards [data-act="ask"]')?.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(requestText(trip, allDays)); toast('コピーしました。Claude Code に貼って頼んでください'); }
      catch (err) { toast('コピーできませんでした'); }
    });
    return;
  }
  $('#cards').innerHTML = items.map(cardHtml).join('');
  document.querySelectorAll('[data-naver]').forEach(a =>
    a.addEventListener('click', e => openNaver(items[+a.dataset.naver], e)));
  document.querySelectorAll('[data-station]').forEach(a => a.addEventListener('click', e => {
    const [i, j] = a.dataset.station.split(',').map(Number);
    openNaver(items[i].stations[j], e);
  }));
  document.querySelectorAll('[data-shift]').forEach(b => b.addEventListener('click', () => shiftFrom(+b.dataset.shift)));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteDaily(+b.dataset.del)));
  document.querySelectorAll('[data-route]').forEach(a => a.addEventListener('click', e => {
    const [i, mode] = a.dataset.route.split(':'); openRoute(+i, mode, e);
  }));
  updateGoTimes();
  document.querySelectorAll('[data-visit]').forEach(b => b.addEventListener('click', () => {
    const [i, s] = b.dataset.visit.split(':'); setVisit(+i, s);
  }));
}

function places() { return items.filter(it => it.lat != null); }
function allBounds() { return L.latLngBounds(places().map(p => [p.lat, p.lng])); }

// 前後のスポット(移動カードや印のないカードで地図をどこに向けるかに使う)
function neighbor(i, dir) {
  for (let j = i + dir; j >= 0 && j < items.length; j += dir) if (items[j].lat != null) return items[j];
  return null;
}

function focus(i) {
  const it = items[i];
  if (it.lat != null) {
    const zoom = it.country === 'kr' && !/空港/.test(it.name) ? 16 : 14;
    map.flyTo([it.lat, it.lng], zoom, { duration: .8 });
  } else if (it.type === 'move') {
    const pts = [neighbor(i, -1), ...(it.stations || []), neighbor(i, 1)].filter(Boolean).map(p => [p.lat, p.lng]);
    if (pts.length >= 2) map.flyToBounds(pts, { padding: [40, 40], duration: .8 });
  } else if (places().length) {
    map.flyToBounds(allBounds(), { padding: [30, 30], duration: .8 });
  }
}
// 予定の場所がまだない時は、日本と韓国が入るくらいに
function fitAll() {
  if (places().length === 1) map.setView([places()[0].lat, places()[0].lng], 15);
  else if (places().length) map.fitBounds(allBounds(), { padding: [30, 30] });
  else if (DAILY) map.setView([35.68, 139.76], 11);   // 日常は自分の位置が分かるまで東京のあたり
  else map.setView([36.0, 133.5], 5);
}

function setActive(i, { scroll = false, fly = true } = {}) {
  if (i < 0 || i >= items.length) return;
  if (i !== active) {
    document.querySelectorAll('.card.on').forEach(c => c.classList.remove('on'));
    document.querySelectorAll('#dots span.on').forEach(c => c.classList.remove('on'));
    Object.values(markers).forEach(m => { m.getElement()?.classList.remove('on-top'); m.getElement()?.querySelector('.pin')?.classList.remove('on'); });
    document.querySelector(`.card[data-i="${i}"]`)?.classList.add('on');
    document.querySelectorAll('#dots span')[i]?.classList.add('on');
    const m = markers[i];
    if (m) { m.getElement()?.classList.add('on-top'); m.getElement()?.querySelector('.pin')?.classList.add('on'); }
    Object.values(stationLayers).forEach(g => g.remove());
    stationLayers[i]?.addTo(map);
    active = i;
    if (fly) focus(i);
  }
  if (scroll) {
    const card = document.querySelector(`.card[data-i="${i}"]`);
    const box = $('#cards');
    box.scrollTo({ left: card.offsetLeft - box.offsetLeft - 16, behavior: 'smooth' });
  }
}

// 今日の日付(日本・韓国とも +9時間)
function todayStr() { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }

// ---- 旅行(いくつもためて切りかえる) ----
// 公開の旅行は data/trips.json。＋で足した旅行は、その端末だけの下書き(localStorage)。
// 下書きは Claude に頼んで data/ に入ったら(名前と1日目が同じ旅行ができたら)自動で消える。
const DRAFT_KEY = 'trip-drafts';
const WEEK = '日月火水木金土';
const weekdayOf = date => WEEK[new Date(date + 'T00:00:00Z').getUTCDay()];
const addDays = (date, n) => new Date(Date.parse(date + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
function loadDrafts() { try { const v = JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveDrafts(v) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }

async function loadTrips() {
  let list = [];
  try {
    const res = await fetch('data/trips.json', { cache: 'no-cache' });
    if (res.ok) list = (await res.json()).trips || [];
  } catch (e) {}
  const official = list.filter(t => t && t.id).map(t => ({ ...t, draft: false }));
  const drafts = loadDrafts();
  const left = drafts.filter(d => !official.some(t => t.start === d.start && t.name === d.name));
  if (left.length !== drafts.length) saveDrafts(left);
  return [...official, ...left.map(d => ({ ...d, draft: true }))];
}

// 旅行の日ならその旅行 → これから行くいちばん近い旅行 → 最後に見た旅行 → いちばん新しい旅行
function pickTrip(list) {
  const today = todayStr();
  const byId = id => list.find(t => t.id === id);
  if (TRIP_PARAM && byId(TRIP_PARAM)) return byId(TRIP_PARAM);
  const now = list.find(t => t.start <= today && today <= (t.end || t.start));
  if (now) return now;
  const next = list.filter(t => t.start > today).sort((a, b) => a.start < b.start ? -1 : 1)[0];
  if (next) return next;
  return byId(store('localStorage', 'trip-last-trip')) ||
         [...list].sort((a, b) => a.start < b.start ? 1 : -1)[0] || null;
}

function tripOptions(list) {
  const today = todayStr();
  const opt = t => `<option value="${esc(t.id)}"${t.id === trip?.id ? ' selected' : ''}>${esc(t.name)}${t.draft ? '(下書き)' : ''}</option>`;
  const ahead = list.filter(t => (t.end || t.start) >= today).sort((a, b) => a.start < b.start ? -1 : 1);
  const past = list.filter(t => (t.end || t.start) < today).sort((a, b) => a.start < b.start ? 1 : -1);
  return (ahead.length ? `<optgroup label="これから・旅行中">${ahead.map(opt).join('')}</optgroup>` : '') +
         (past.length ? `<optgroup label="これまでの旅行">${past.map(opt).join('')}</optgroup>` : '');
}

// 予定のファイルがまだない日は、旅行の日付から空の日をつくる(下書きもこれ)
function emptyDays(t) {
  const days = [];
  for (let n = 1, d = t.start; d && d <= (t.end || t.start) && n <= 30; n++, d = addDays(d, 1)) {
    days.push({ id: 'day' + n, data: { title: `${n}日目`, date: d, weekday: weekdayOf(d), items: [] } });
  }
  return days;
}

// day1, day2 … と、ないファイルに当たるまで読む
async function loadDays(t) {
  if (!t) return [];
  if (t.draft) return emptyDays(t);
  const days = [];
  for (let n = 1; n <= 30; n++) {
    try {
      const res = await fetch(`data/trips/${encodeURIComponent(t.id)}/day${n}.json`, { cache: 'no-cache' });
      if (!res.ok) break;
      days.push({ id: 'day' + n, data: await res.json() });
    } catch (e) { break; }
  }
  // 足りない日(最後の日まで)は空の日で埋める
  const blank = emptyDays(t);
  for (let n = days.length; n < blank.length; n++) days.push(blank[n]);
  return days;
}

const dayHref = id => `?trip=${encodeURIComponent(trip.id)}&day=${encodeURIComponent(id)}`;
function daysHtml(days) {
  return days.map((d, n) => {
    const [, mo, dd] = d.data.date.split('-').map(Number);
    const label = (String(d.data.title || '').match(/\d+日目/) || [`${n + 1}日目`])[0] + ' ' + mo + '/' + dd + `(${d.data.weekday || weekdayOf(d.data.date)})`;
    return `<a href="${dayHref(d.id)}" class="${d.id === DAY ? 'on' : ''}"${d.id === DAY ? ' aria-current="page"' : ''}>${esc(label)}</a>`;
  }).join('');
}

// 今の時刻(日本・韓国とも +9時間)に合わせる。
// 旅行の日なら「いま始まっている予定」、ほかの日は時刻だけで合わせる。
function nowIndex() {
  const offMin = 9 * 60;
  const local = new Date(Date.now() + offMin * 60000);
  const today = local.toISOString().slice(0, 10);
  const mins = local.getUTCHours() * 60 + local.getUTCMinutes();
  const isDay = today === data.date;
  let idx = 0;
  items.forEach((it, i) => {
    if (!it.time) return;   // 日常の「時間なし」の予定
    const [h, m] = it.time.split(':').map(Number);
    if (h * 60 + m <= mins) idx = i;
  });
  return { idx, isDay };
}

// ---- 交通費の見積もり(便利メニュー) ----
// 入っている予定を、となりの場所どうし電車・バスで動いた時の料金のめやす。決まりは data/fare_rules.json。
// 飛行機・車・タクシー・ケーブルカーは数えない。800m 未満は歩く(0)。予定が少しだけでも出す。
let fareRules = null;
async function loadFareRules() {
  if (fareRules) return fareRules;
  const res = await fetch('data/fare_rules.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('fare_rules');
  return (fareRules = await res.json());
}
function meters(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function subwayFare(rule, km) {
  let f = rule.base, from = rule.base_km;
  for (const st of rule.steps) {
    if (km <= from) break;
    const span = Math.min(km, st.to_km) - from;
    f += Math.ceil(span / st.every_km) * st.add;
    from = st.to_km;
  }
  return f;
}
// 移動の予定の名前・メモから、乗り物を決める
function moveKind(mv) {
  const t = (mv?.name || '') + ' ' + (mv?.memo || '');
  const n = mv?.name || '';
  if (/飛行機|ZIPAIR|フライト|✈|便/.test(n)) return 'plane';
  if (/タクシー|車で|レンタカー|自家用車/.test(n)) return 'car';
  if (/ケーブルカー|ロープウェイ|フェリー|船/.test(n)) return 'other';
  if (/リムジンバス|空港バス/.test(n)) return 'airport_bus';
  if (/歩いて|徒歩/.test(n)) return 'walk';
  if (/バス/.test(n) && !/地下鉄|電車/.test(n)) return 'bus';
  if (/地下鉄|電車|線|鉄道|メトロ/.test(t)) return 'subway';
  return null;
}
function fareSegments(day) {
  const its = day.data.items || [];
  const segs = [];
  let prev = null, moves = [];
  for (const it of its) {
    if (it.type === 'move') { moves.push(it); continue; }
    if (it.lat == null) continue;                       // 場所が決まっていない予定は飛ばす(前の場所からつなぐ)
    // 日の最初の移動(ホテルなど、予定にない所から出る)も数える。距離が分からないので基本料金
    if (prev || moves.length) segs.push({ from: prev || { name: '出発地', country: it.country }, to: it, moves });
    prev = it; moves = [];
  }
  return segs.map(sg => {
    const c = sg.to.country || sg.from.country;
    const rule = fareRules.countries?.[c];
    const d = sg.from.lat != null ? meters(sg.from, sg.to) : 0;
    const kinds = sg.moves.map(moveKind);
    const label = sg.moves.length ? sg.moves.map(m => m.name).join(' → ') : '';
    const base = { from: sg.from.name, to: sg.to.name, label, km: d / 1000 };
    if (kinds.some(k => k === 'plane')) return { ...base, off: '飛行機(数えない)' };
    if (kinds.some(k => k === 'car')) return { ...base, off: '車・タクシー(数えない)' };
    if (kinds.some(k => k === 'other')) return { ...base, off: 'IC カードを使わない乗り物(数えない)' };
    if (!kinds.length && sg.from.lat != null && d < 800) return { ...base, how: '歩く', fare: 0, cur: '' };
    if (!rule) return { ...base, off: '料金の決まりがありません' };
    if (kinds.includes('airport_bus')) {
      const mv = sg.moves[kinds.indexOf('airport_bus')];
      const m = (mv.memo || '').match(/(\d{1,3}(?:,\d{3})+|\d{4,6})\s*ウォン/);
      return { ...base, how: '空港バス', fare: m ? Number(m[1].replace(/,/g, '')) : rule.airport_bus.base, cur: rule.currency };
    }
    if (kinds.includes('walk') || (!kinds.length && sg.from.lat != null && d < rule.walk_m)) return { ...base, how: '歩く', fare: 0, cur: rule.currency };
    if (kinds.includes('bus')) return { ...base, how: 'バス', fare: rule.bus.base, cur: rule.currency };
    const km = sg.from.lat != null ? d * rule.road_factor / 1000 : 0;
    return { ...base, how: kinds.includes('subway') ? '地下鉄' : '電車・バス(推定)', fare: subwayFare(rule.subway, km), cur: rule.currency, guess: !kinds.includes('subway') };
  });
}
const won = n => '₩' + Math.round(n).toLocaleString('ja-JP');
const yen = (n, r) => '¥' + (Math.round(n / r / 10) * 10).toLocaleString('ja-JP');
const roundUp = (n, u) => Math.ceil(n / u) * u;
function fareRange(sum, nDays) {
  // 下は予定どおり。上は、予定に書いていないホテルへの帰り(1日1回)と、乗り換えの失敗・予定外の移動(3割増し)も見込む
  const base = fareRules.countries.kr.subway.base;
  return [sum, sum ? roundUp(sum * 1.3 + base * nDays, 1000) : 0];
}
function fareText(days, all) {
  const r = fareRules.rate.KRW_per_JPY;
  const lines = [`【${trip.name}】交通費のめやす(電車・バス)`, `チャージのめやす: ${won(all[0])}〜${won(all[1])}(約${yen(all[0], r)}〜${yen(all[1], r)})`];
  days.forEach(d => {
    lines.push('', `${d.title}: ${won(d.sum)}`);
    d.segs.forEach(s => lines.push(`・${s.from} → ${s.to}: ${s.off ? s.off : `${s.how} ${won(s.fare)}`}`));
  });
  lines.push('', `※おおよその目安です(1円=${r}ウォンで計算。${fareRules.rate.date} 時点)`);
  return lines.join('\n');
}
async function openFareSheet() {
  const box = $('#fareSheet .sheet');
  box.innerHTML = '<h2>交通費の見積もり</h2><p class="hint">計算しています…</p>';
  $('#fareSheet').hidden = false;
  try { await loadFareRules(); } catch (e) { box.innerHTML = '<h2>交通費の見積もり</h2><p class="hint">料金の決まりを読みこめませんでした。</p><div class="row"><button type="button" data-act="close">閉じる</button></div>'; return; }
  const r = fareRules.rate.KRW_per_JPY;
  const days = allDays.map(d => {
    const segs = fareSegments(d);
    return { title: `${(String(d.data.title || '').match(/\d+日目/) || [d.id])[0]} ${d.data.date.slice(5).replace('-', '/')}`, segs, sum: segs.reduce((a, s) => a + (s.fare || 0), 0) };
  }).filter(d => d.segs.length);
  const total = days.reduce((a, d) => a + d.sum, 0);
  const all = fareRange(total, days.length);
  const nRide = days.reduce((a, d) => a + d.segs.filter(s => s.fare > 0).length, 0);
  const rule = fareRules.countries.kr;
  box.innerHTML = '<h2>交通費の見積もり</h2>' + (days.length ? `
    <div class="fare-total"><div class="lbl">チャージのめやす(電車・バス ${nRide}回)</div>
      <div class="big">${won(all[0])}〜${won(all[1])}</div>
      <div class="yen">約 ${yen(all[0], r)}〜${yen(all[1], r)}</div>
      <div class="sub">下は予定どおりに動いた時。上は、予定にないホテルへの帰り(1日1回)と、乗り換えの失敗・予定外の移動(3割増し)も見込んだ額。</div></div>` +
    days.map(d => `<div class="fare-day"><span>${esc(d.title)}</span><span>${won(d.sum)}</span></div><ul>${d.segs.map(s => `
      <li class="fare${s.off ? ' off' : ''}"><span>${esc(s.from)} → ${esc(s.to)}<br><small>${esc(s.off || s.how + (s.km >= 1 ? `・約${s.km.toFixed(1)}km` : ''))}${s.label && !s.off ? `・${esc(s.label)}` : ''}</small></span><span class="amt">${s.off ? '—' : won(s.fare)}</span></li>`).join('')}</ul>`).join('') +
    `<p class="fare-src">おおよその目安です。距離は地図の直線距離から出しています。乗り換えの割引は入れていないので、実際は少し安くなることが多いです。1円=${r}ウォン(${esc(fareRules.rate.date)})。<br>料金の決まり: ${esc(rule.subway.note)}。バス ${won(rule.bus.base)}・空港バス ${won(rule.airport_bus.base)}。<br>出どころ: ${rule.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(' / ')}(${esc(rule.checked)})</p>`
    : '<p class="hint">場所の入った予定がまだないので、見積もれません。</p>') +
    '<div class="row"><button type="button" class="main" data-act="copy">コピー</button><button type="button" data-act="close">閉じる</button></div>';
  box.dataset.text = days.length ? fareText(days, all) : '';
}

// ---- 日常の画面(2026-11-19 Taku「日常の毎日の生活で使えるもう一画面」) ----
// 旅行と同じ地図とカード。開くといつも今日の日付で、上の欄に行きたい場所を入れて足す。
// 公開のページなので、日常の行き先はその端末の中(localStorage)だけに残す(data/ には入れない)。
const DAILY_KEY = 'daily-plans';   // { "2026-11-19": [{ id, name, time, memo, lat, lng, country, kr? }] }
const MODE_KEY = 'trip-mode';
function loadDaily() { try { const v = JSON.parse(localStorage.getItem(DAILY_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } }
function saveDaily(v) { try { localStorage.setItem(DAILY_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }
function dailyLabel(date) {
  const t = todayStr(), [, m, d] = date.split('-').map(Number);
  const rel = date === t ? '今日' : date === addDays(t, 1) ? '明日' : date === addDays(t, -1) ? '昨日' : '';
  return `${m}月${d}日(${weekdayOf(date)})` + (rel ? ` ${rel}` : '');
}
const dailyHref = date => `?mode=daily&date=${encodeURIComponent(date)}`;
// 時間のある予定を時刻の順に、時間なしはそのあと(足した順)
function dailyItems(date) {
  const list = (loadDaily()[date] || []).map(x => ({ ...x }));
  list.sort((a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || (a.time || '').localeCompare(b.time || '') || a.id - b.id);
  let no = 0;
  list.forEach(it => { it.memo = it.memo || ''; if (it.lat != null) it.no = ++no; });
  return list;
}
// 旅行の日に入力枠で足した場所も、その端末の中だけ(公開の data/ は変えない)。キーは「旅行の id|日付」
const EXTRA_KEY = 'trip-extra';
function loadExtra() { try { const v = JSON.parse(localStorage.getItem(EXTRA_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } }
const extraId = () => trip.id + '|' + data.date;
// 入力枠で足した分の置き場(日常 / 旅行)。読む・書く・足したあとに開き直す所
function localBox() {
  return DAILY
    ? { key: data.date, load: loadDaily, save: saveDaily, href: dailyHref(data.date) }
    : { key: extraId(), load: loadExtra, save: v => { try { localStorage.setItem(EXTRA_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } },
        href: `?trip=${encodeURIComponent(trip.id)}&day=${encodeURIComponent(DAY)}` };
}
// 旅行の日の予定に、この端末で足した場所を時刻の順に混ぜる(時間なしは最後)。印の番号は振り直す
function mergeExtra(list) {
  const extra = (loadExtra()[extraId()] || []).map(x => ({ ...x, memo: x.memo || '', local: true }));
  if (!extra.length) return list;
  const out = [...list];
  extra.forEach(x => {
    const k = x.time ? out.findIndex(it => it.time && it.time > x.time) : -1;
    out.splice(k < 0 ? out.length : k, 0, x);
  });
  let no = 0;
  out.forEach(it => { if (it.lat != null && it.type !== 'move') it.no = ++no; });
  return out;
}
function deleteDaily(i) {
  const it = items[i], box = localBox();
  if (!confirm(`「${it.name}」を消しますか?`)) return;
  const all = box.load();
  all[box.key] = (all[box.key] || []).filter(x => x.id !== it.id);
  if (!all[box.key].length) delete all[box.key];
  box.save(all);
  location.href = box.href;
}
function addDaily(entry) {
  const box = localBox(), all = box.load();
  const it = { id: Date.now(), name: entry.name, time: $('#dTime').value || '', memo: $('#dMemo').value.trim(),
               lat: entry.lat ?? null, lng: entry.lng ?? null, country: entry.country || 'jp' };
  if (entry.kr) it.kr = entry.kr;
  (all[box.key] = all[box.key] || []).push(it);
  if (!box.save(all)) { toast('この端末に保存できませんでした(プライベートブラウズ?)'); return; }
  store('sessionStorage', 'daily-focus', String(it.id));
  location.href = box.href;
}
// 場所さがしは OpenStreetMap の Nominatim(キー不要)。今いる所の近くを先に出す
async function findPlaces(q) {
  // 「35.68, 139.76」のように座標を貼った時はそのまま使う
  const ll = q.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if (ll) return [{ name: q.replace(ll[0], '').trim() || '指定した場所', addr: `${ll[1]}, ${ll[2]}`, lat: +ll[1], lng: +ll[2], country: 'jp' }];
  const p = new URLSearchParams({ q, format: 'jsonv2', limit: '8', 'accept-language': 'ja', addressdetails: '1', namedetails: '1' });
  const c = me || (map && map.getCenter && [map.getCenter().lat, map.getCenter().lng]);
  if (c) p.set('viewbox', [c[1] - .3, c[0] + .3, c[1] + .3, c[0] - .3].join(','));
  const res = await fetch('https://nominatim.openstreetmap.org/search?' + p);
  if (!res.ok) throw new Error('search');
  const list = (await res.json()).filter((r, k, a) =>   // 同じ名前ですぐ近く(100m)の重なりは1つに
    a.findIndex(o => o.name === r.name && meters({ lat: +o.lat, lng: +o.lon }, { lat: +r.lat, lng: +r.lon }) < 100) === k);
  return list.map(r => ({
    name: r.name || String(r.display_name).split(',')[0],
    addr: String(r.display_name).split(',').slice(1, 5).join(',').trim(),
    lat: +r.lat, lng: +r.lon, country: (r.address?.country_code || 'jp').toLowerCase(),
    // 韓国は NAVER で探す時に韓国語の名前を使う
    kr: (r.address?.country_code === 'kr' && (r.namedetails?.['name:ko'] || r.namedetails?.name)) || undefined
  })).sort((a, b) => me ? meters({ lat: me[0], lng: me[1] }, a) - meters({ lat: me[0], lng: me[1] }, b) : 0);
}
function setupDailyAdd() {
  const f = $('#dailyAdd'), sheet = $('#findSheet');
  let found = [];
  f.hidden = false;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('#dQuery').value.trim();
    if (!q) { $('#dQuery').focus(); return; }
    $('#dQuery').blur();
    $('#findTitle').textContent = `「${q}」を ${DAILY ? dailyLabel(data.date) : (String(data.title || '').match(/\d+日目/) || [''])[0] + ' ' + dailyLabel(data.date).replace(/ (今日|明日|昨日)$/, '')} に足す`;
    $('#dTime').value = ''; $('#dMemo').value = '';
    const ul = $('#foundList');
    ul.innerHTML = '<li><small>探しています…</small></li>';
    sheet.hidden = false;
    try { found = await findPlaces(q); } catch (err) { found = []; }
    const g = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    ul.innerHTML = found.map((r, k) => `<li data-k="${k}"><b>${esc(r.name)}</b><small>${esc(r.addr)}${me ? `・約${(meters({ lat: me[0], lng: me[1] }, r) / 1000).toFixed(1)}km` : ''}</small></li>`).join('') +
      (found.length ? '' : '<li><small>地図の上では見つかりませんでした。下の「場所なしで足す」か、Google マップで探してください。</small></li>') +
      `<li class="plain" data-k="-1"><b>＋ 場所なしで足す</b><small>「${esc(q)}」をメモとして足す(地図の印は付きません)</small></li>` +
      `<li class="plain" data-g="1"><b>Google マップで探す</b><small>見つからない時に。見つけたら座標(35.68, 139.76 の形)をコピーして上の欄に貼れます</small></li>`;
    ul.dataset.q = q; ul.dataset.g = g;
  });
  $('#foundList').addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    if (li.dataset.g) { window.open(e.currentTarget.dataset.g, '_blank', 'noopener'); return; }
    if (li.dataset.k == null) return;
    const k = +li.dataset.k;
    addDaily(k < 0 ? { name: e.currentTarget.dataset.q } : found[k]);
  });
  sheet.addEventListener('click', e => {
    if (e.target.id === 'findSheet' || e.target.closest('button')?.dataset.act === 'close') sheet.hidden = true;
  });
}
function setupDaily() {
  DAILY = true;
  const date = /^\d{4}-\d{2}-\d{2}$/.test(Q.get('date') || '') ? Q.get('date') : todayStr();
  $('.trip-pick').hidden = true;
  $('#addTrip').hidden = true;   // 日常は上の欄で足す
  $('#dayTitle').hidden = false;
  $('#dayTitle').innerHTML = esc(dailyLabel(date).replace(/ (今日|明日|昨日)$/, '')) +
    (/ (今日|明日|昨日)$/.test(dailyLabel(date)) ? `<small>${dailyLabel(date).split(' ').pop()}</small>` : '');
  // 日の切りかえ: 昨日〜1週間後
  const t = todayStr(), all = loadDaily();
  const dates = Array.from({ length: 8 }, (_, n) => addDays(t, n - 1));
  if (!dates.includes(date)) dates.push(date);
  $('#days').innerHTML = dates.map(d => {
    const [, m, dd] = d.split('-').map(Number);
    const rel = d === t ? '今日 ' : d === addDays(t, 1) ? '明日 ' : '';
    const n = (all[d] || []).length;
    return `<a href="${dailyHref(d)}" class="${d === date ? 'on' : ''}"${d === date ? ' aria-current="page"' : ''}>${rel}${m}/${dd}(${weekdayOf(d)})${n ? ` ・${n}` : ''}</a>`;
  }).join('');
  items = dailyItems(date);
  data = { title: '日常', date, weekday: weekdayOf(date), items };
  allDays = [{ id: date, data }];
  items.forEach(it => { it.t0 = it.time; it.e0 = it.end; });
  setupDailyAdd();
  $('#nowBtn').textContent = date === t ? '今ここ' : '今日へ';
  return true;
}
// 旅行 ↔ 日常: タブを押すか、上の帯を左右にスワイプ。最後に開いた方を覚える
function setupModeTabs() {
  document.querySelectorAll('#modeTabs a').forEach(a => {
    a.classList.toggle('on', (a.dataset.mode === 'daily') === DAILY);
    a.addEventListener('click', () => store('localStorage', MODE_KEY, a.dataset.mode));
  });
  let x0 = null, y0 = 0;
  const go = mode => { if ((mode === 'daily') === DAILY) return; store('localStorage', MODE_KEY, mode); location.href = '?mode=' + mode; };
  $('header').addEventListener('touchstart', e => {
    if (e.target.closest('#days, select, input')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  $('header').addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) go(dx < 0 ? 'daily' : 'trip');
  }, { passive: true });
}

// 旅行の画面の読みこみ(旅行を選び、その日の予定を items に入れる)。出せない時は false
async function setupTrip() {
  trip = pickTrip(trips);
  const sel = $('#tripSel');
  sel.innerHTML = tripOptions(trips) || '<option>旅行がまだありません</option>';
  sel.addEventListener('change', () => {
    // 選んだ旅行はリンクでも開けるように、?trip= をつけて開き直す
    store('sessionStorage', 'trip-pick', '');
    location.href = `?trip=${encodeURIComponent(sel.value)}`;
  });
  if (!trip) {
    $('#cards').innerHTML = '<p id="error">旅行がまだありません。右上の ＋ で足せます。</p>';
    return false;
  }
  store('localStorage', 'trip-last-trip', trip.id);
  const days = await loadDays(trip);
  allDays = days;
  // 旅行の当日は、どのリンクから開いても今日の日を出す(日付ボタンで選び直した時だけ、その日)。
  // ほかの日は、URL の日 → 最後に見た日 → 1日目の順。最後に見た日は旅行ごとに覚える。
  const lastKey = 'trip-last:' + trip.id;
  const todayDay = days.find(d => d.data.date === todayStr());
  const picked = store('sessionStorage', 'trip-pick');
  if (todayDay && !(DAY_PARAM && picked === trip.id + '|' + DAY_PARAM)) DAY = todayDay.id;
  else if (!DAY_PARAM || !days.some(d => d.id === DAY_PARAM)) DAY = (days.find(d => d.id === store('localStorage', lastKey)) || days[0] || { id: 'day1' }).id;
  store('localStorage', lastKey, DAY);
  data = days.find(d => d.id === DAY)?.data;
  if (!data) {
    $('#cards').innerHTML = '<p id="error">この旅行の予定を読みこめませんでした。</p>';
    return false;
  }
  items = data.items = mergeExtra(data.items || []);
  items.forEach(it => { it.t0 = it.time; it.e0 = it.end; });
  if (isTripDay()) { loadOffsets(); applyOffsets(); }
  setupDailyAdd();   // 旅行の日にも、行きたい場所の入力枠を出す(2026-11-19 Taku)
  // ホーム画面に追加する時の名前になるので、短く「トラベラー」のまま(旅行の名前は左上に出る)
  document.title = 'トラベラー';
  $('#days').innerHTML = daysHtml(days);
  $('#days .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  document.querySelectorAll('#days a').forEach(a => a.addEventListener('click', () =>
    store('sessionStorage', 'trip-pick', trip.id + '|' + new URLSearchParams(a.search).get('day'))));
  return true;
}

async function main() {
  setupAddSheet();
  setupTools();
  trips = await loadTrips();
  // どちらの画面で開くか: リンクの指定 → 旅行の当日は旅行 → 最後に開いた方 → 日常
  const today = todayStr();
  const tripToday = trips.some(t => !t.draft && t.start <= today && today <= (t.end || t.start));
  const mode = Q.get('mode') || (TRIP_PARAM || DAY_PARAM ? 'trip' : null) ||
               (tripToday ? 'trip' : null) || store('localStorage', MODE_KEY) || 'daily';
  if (mode === 'daily') setupDaily();
  setupModeTabs();
  if (!DAILY && !(await setupTrip())) return;

  map = L.map('map', { zoomControl: false, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  fitAll();
  addLocateButton();
  if (isTripDay() || DAILY) startWatch();  // 旅行の当日と日常は、開いた時から自分の位置を出す

  // スポットを順番に線で結ぶ。移動の区間は点線にし、乗り降りする駅があれば駅を通す。
  let prev = null, dashed = false, via = [];
  items.forEach(it => {
    if (it.type === 'move') { dashed = true; via.push(...(it.stations || [])); return; }
    if (it.lat == null) return;
    if (prev) {
      L.polyline([prev, ...via, it].map(p => [p.lat, p.lng]), {
        color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e8590c',
        weight: 3, opacity: .75, dashArray: dashed ? '6 8' : null
      }).addTo(map);
    }
    prev = it; dashed = false; via = [];
  });

  items.forEach((it, i) => {
    if (!it.stations) return;
    stationLayers[i] = L.layerGroup(it.stations.map(st => L.marker([st.lat, st.lng], {
      icon: L.divIcon({ className: '', html: `<div class="station">${esc(st.icon || '🚇')} ${esc(st.name)}${st.role ? `<small>${esc(st.role)}</small>` : ''}</div>`, iconSize: [0, 0] }),
      title: st.name, keyboard: false
    })));
  });

  items.forEach((it, i) => {
    if (it.lat == null) return;
    const m = L.marker([it.lat, it.lng], {
      icon: L.divIcon({ className: '', html: `<div class="pin">${it.no}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }),
      title: `${CIRCLED[it.no] || it.no} ${it.name}`, keyboard: true
    }).addTo(map);
    m.on('click', () => setActive(i, { scroll: true }));
    markers[i] = m;
  });

  renderCards();
  $('#dots').innerHTML = items.map(() => '<span></span>').join('');
  refreshVisits();
  $('#visitBar').addEventListener('click', openVisitSheet);
  $('#visitSheet').addEventListener('click', async e => {
    const act = e.target.dataset?.act;
    if (e.target.id === 'visitSheet' || act === 'close') { $('#visitSheet').hidden = true; return; }
    if (act === 'copy') {
      try { await navigator.clipboard.writeText(visitListText()); toast('コピーしました。Claude に貼ればリストに反映できます'); }
      catch (err) { toast('コピーできませんでした'); }
    }
  });
  $('#shiftBar').addEventListener('click', () => {
    if (!confirm('ずらした時刻を元の予定に戻しますか?')) return;
    offsets = []; saveOffsets(); applyOffsets(); renderCards();
    const i = active; active = -1; setActive(i, { scroll: true, fly: false });
    toast('元の予定に戻しました');
  });

  // スワイプが止まったら、いちばん左に来たカードを選ぶ
  const box = $('#cards');
  let st;
  const pick = () => {
    const cards = [...box.querySelectorAll('.card')];
    const x = box.scrollLeft;
    let best = 0, bestD = Infinity;
    cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft - box.offsetLeft - 16 - x); if (d < bestD) { bestD = d; best = i; } });
    setActive(best);
  };
  box.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(pick, 120); }, { passive: true });

  $('#nowBtn').addEventListener('click', () => {
    if (DAILY && data.date !== todayStr()) { location.href = dailyHref(todayStr()); return; }
    if (DAILY && !items.some(it => it.time)) {
      if (me) map.flyTo(me, Math.max(map.getZoom(), 15), { duration: .8 }); else { startWatch(); toast('現在地を探しています…'); }
      return;
    }
    const n = nowIndex();
    setActive(n.idx, { scroll: true });
    toast(n.isDay ? 'いまの予定を表示しました' : '旅行の日ではないので、時刻だけで合わせました');
  });

  // 旅行の当日に開いたら、はじめから今の予定を出す
  // 日常で今足した場所は、そのカードを出す
  const added = store('sessionStorage', 'daily-focus');
  if (added) {
    store('sessionStorage', 'daily-focus', '');
    const k = items.findIndex(it => String(it.id) === added);
    if (k >= 0) { setActive(k, { scroll: true, fly: false }); focus(k); toast(`「${items[k].name}」を足しました`); return; }
  }
  const n = nowIndex();
  if (n.isDay && items.length) setActive(n.idx, { scroll: true, fly: false }), focus(n.idx);
  else setActive(0, { fly: false });
}
main();
</script>
